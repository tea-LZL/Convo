name: Linux Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  bundle:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils file libfuse2
      - name: Pin AppImage bundler
        shell: bash
        run: |
          tool="$HOME/.cache/tauri/linuxdeploy-x86_64.AppImage"
          mkdir -p "$(dirname "$tool")"
          curl --fail --location --retry 3 \
            --output "$tool" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          echo "421ca71d5c69ea97c6309276232990d43df1dcece0edfaa26bbf926ff96ed12e  $tool" | sha256sum --check
          chmod +x "$tool"
          echo "$HOME/.cache/tauri" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run check:version
      - run: npm run check:commands
      - run: npm run tauri build
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: convo-linux
          path: src-tauri/target/release/bundle/
