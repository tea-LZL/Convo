name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debian:
    name: Build Debian Package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install frontend dependencies
        run: npm install

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Debian package
        run: cargo tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  build-arch:
    name: Build Arch Linux Package
    runs-on: ubuntu-22.04
    container:
      image: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm \
            base-devel \
            git \
            nodejs \
            npm \
            rust \
            cargo \
            webkit2gtk-4.1 \
            gtk3 \
            libayatana-appindicator \
            librsvg \
            patchelf \
            zstd

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from tauri.conf.json
        id: version
        run: |
          VERSION=$(grep -o '"version": *"[^"]*"' src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build with Tauri
        run: |
          npm install
          cargo install tauri-cli --version "^2"
          cargo tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Create Arch package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKGDIR="pkg"
          mkdir -p "$PKGDIR"/{usr/bin,usr/share/applications,usr/share/icons/hicolor/{32x32,128x128,256x256@2}/apps}

          # Install binary
          cp src-tauri/target/release/convo "$PKGDIR/usr/bin/convo"

          # Install desktop file
          cat > "$PKGDIR/usr/share/applications/convo.desktop" << 'EOF'
          [Desktop Entry]
          Name=Convo
          Comment=A sleek desktop chat application for Linux that connects to local Ollama models
          Exec=/usr/bin/convo
          Icon=convo
          Terminal=false
          Type=Application
          Categories=Utility;
          MimeType=x-scheme-handler/convo;
          EOF

          # Install icons
          cp src-tauri/icons/32x32.png "$PKGDIR/usr/share/icons/hicolor/32x32/apps/convo.png"
          cp src-tauri/icons/128x128.png "$PKGDIR/usr/share/icons/hicolor/128x128/apps/convo.png"
          cp src-tauri/icons/128x128@2x.png "$PKGDIR/usr/share/icons/hicolor/256x256@2/apps/convo.png"

          # Build .PKGINFO
          cat > "$PKGDIR/.PKGINFO" << EOF
          # Generated by GitHub Actions
          pkgname = convo
          pkgbase = convo
          pkgver = ${VERSION}-1
          pkgdesc = A sleek desktop chat application for Linux that connects to local Ollama models
          url = https://github.com/${{ github.repository }}
          builddate = $(date +%s)
          packager = GitHub Actions
          size = $(du -sb "$PKGDIR/usr" | cut -f1)
          arch = x86_64
          license = MIT
          depend = webkit2gtk-4.1
          depend = gtk3
          depend = libayatana-appindicator
          EOF

          # Create .MTREE for package integrity
          cd "$PKGDIR"
          bsdtar -czf .MTREE --format=mtree \
            --options='!all,use-set,type,uid,gid,mode,time,size,sha256' \
            usr/bin/convo \
            usr/share/applications/convo.desktop \
            usr/share/icons/hicolor/32x32/apps/convo.png \
            usr/share/icons/hicolor/128x128/apps/convo.png \
            usr/share/icons/hicolor/256x256@2/apps/convo.png \
            .PKGINFO
          cd ..

          # Create the package archive with zstd compression
          tar -cf - -C "$PKGDIR" \
            --transform='s,^,./,' \
            .PKGINFO \
            .MTREE \
            usr/bin/convo \
            usr/share/applications/convo.desktop \
            usr/share/icons/hicolor/32x32/apps/convo.png \
            usr/share/icons/hicolor/128x128/apps/convo.png \
            usr/share/icons/hicolor/256x256@2/apps/convo.png \
            | zstd -19 -o "Convo_${VERSION}_archlinux_x86_64.pkg.tar.zst"

          echo "Created package: Convo_${VERSION}_archlinux_x86_64.pkg.tar.zst"
          ls -lh "Convo_${VERSION}_archlinux_x86_64.pkg.tar.zst"

      - name: Upload Arch Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: archlinux-package
          path: Convo_*_archlinux_x86_64.pkg.tar.zst
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [build-debian, build-arch]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
